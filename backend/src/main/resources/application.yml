spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:syxs_db}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: init-existing-schema
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  cache:
    type: caffeine

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

syxs:
  jwt:
    secret: syxs-local-dev-secret-key-syxs-local-dev-secret-key
    access-expiry: 86400
    refresh-expiry: 604800
  otp:
    mode: console
    expire-minutes: 5
  file:
    upload-dir: ./uploads
    access-path: /uploads/**
  carbon:
    points-per-yuan: 0.05
    co2-per-yuan: 0.0008

  ai:
    ollama:
      enabled: false
      base-url: http://127.0.0.1:11434
      model: llava:7b

